{% extends "admin/a_base.html" %}
{# Change admin password #}
{% block body %}
  <h1>Admin Account</h1>
  <form method="post" class="fs" style="max-width:420px">
    <input type="hidden" name="_csrf" value="{{ csrf() }}"><label>Current password</label><input type="password" name="old" required><label>New password (10+ characters)</label><input type="password" name="new" required minlength="10"><label>Confirm new password</label><input type="password" name="new2" required>
    <p>
      <button class="btn gold">Change password</button>
    </p>
  </form>
{% endblock %}
